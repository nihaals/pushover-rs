[package]
name = "pushover-rs"
version = "0.3.23"
edition = "2021"
license = "MIT"
description = "A Rust client for Pushover (https://www.pushover.net)"
homepage = "https://github.com/Oscuro87/pushover-rs"
documentation = "https://docs.rs/pushover-rs/latest/"
repository = "https://github.com/Oscuro87/pushover-rs"
readme = "README.md"
keywords = [
    "pushover",
    "notification",
    "mobile",
    "desktop",
    "push"
]
authors = ["Emka877"]

[dependencies]
reqwest = { version = "0.13", features = ["json", "blocking", "multipart"], default-features = false }
serde = { version = "1.0.226", features = ["derive"], default-features = false }
tokio = { version = "1", features = ["fs"], default-features = false }

[dev-dependencies]
ron = "^0.11.0"
serde_json = "1.0.145"
tokio = { version = "1", features = ["macros", "rt-multi-thread"], default-features = false }

[features]
default = ["default-tls"]
default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls"]

[[example]]
name = "usage"
path = "examples/usage.rs"

[[example]]
name = "usage-with-attachment"
path = "examples/usage_with_attachment.rs"
